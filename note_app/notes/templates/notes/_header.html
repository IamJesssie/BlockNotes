{% load static %}
<header class="new-header">
    <a href="{% url 'notes:list_notes' %}" class="logo-block">
        <div class="logo-icon-wrapper">
            <img src="{% static 'notes/img/figma/logo-4-12.svg' %}" alt="BlockNotes logo" />
        </div>
        <span class="logo-text">BlockNotes</span>
    </a>
    <div class="user-controls">
        {% if user.is_authenticated %}
            <div class="user-info-pill">
                <img src="{% static 'notes/img/Icon-9.svg' %}" alt="User" />
                <span>{{ user.username }}</span>
            </div>
            <button id="walletConnectButton" class="btn btn-outline-primary wallet-connect-btn" data-bs-toggle="modal" data-bs-target="#walletModal">
                <i class="bi bi-wallet2"></i> Connect Wallet
            </button>
            <!-- Test button hidden for presentation -->
            <button id="testSendAdaButton" class="btn btn-outline-success" style="margin-left: 10px; cursor: pointer; display: none;">
                Send Test ADA
            </button>
            <a href="{% url 'account_logout' %}" class="logout-button">
                <img src="{% static 'notes/img/Icon-8.svg' %}" alt="Logout" />
                Logout
            </a>
        {% else %}
            <a href="{% url 'account_login' %}" class="btn-new-note">Login</a>
        {% endif %}
    </div>
</header>
