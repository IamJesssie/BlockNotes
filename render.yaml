services:
  - type: web
    name: blocknotes
    runtime: python
    plan: free
    branch: feature/web3-ui-redesign
    buildCommand: "./build.sh"
    startCommand: "cd note_app && gunicorn note_app.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: blocknotes-db
          property: connectionString

databases:
  - name: blocknotes-db
    plan: free
    databaseName: blocknotes
    user: blocknotes_user
